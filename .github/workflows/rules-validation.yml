name: Rules validation

on:
  pull_request:
    paths:
      - "rules/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    name: Validate rule files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a  # v21
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39  # v13

      - name: Validate all rule files
        run: nix develop --command cargo run -p ra-cli --bin ra -- validate rules/

      # Ratchet: 186 is the current malformed-rule backlog (tracked). The step
      # fails if the count *increases*, blocking new malformed rules while the
      # backlog is burned down.
      - name: Lint rewrite patterns (ratchet on malformed rules)
        run: nix develop --command cargo run -p ra-cli --bin ra -- rules lint rules/ --baseline 186
